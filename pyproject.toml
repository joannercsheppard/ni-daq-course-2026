[project]
name = "ni-daq-course-2026"
version = "2026.1"
description = "Course materials: data acquisition with NI-DAQmx and Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # nidaqmx is only the Python wrapper: the NI-DAQmx driver must also be
    # installed (Windows or Linux), see README.md.
    "nidaqmx>=1.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jupyter>=1.0",
]

[tool.uv]
# These are course scripts, not a package to install.
package = false
